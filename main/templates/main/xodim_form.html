{% extends 'base.html' %}

{% block title %}Xodim Qo'shish{% endblock %}

{% block content %}
<style>
    input[type="checkbox"] {
        width: 22px;
        height: 22px;
        accent-color: #7c3aed;
        cursor: pointer;
        flex-shrink: 0;
    }
</style>

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">👥 Xodim Qo'shish</h2>
    <p class="text-sm text-gray-600">Yangi xodim qo'shish</p>
</div>

<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-sm border border-blue-100 overflow-hidden">
        <div class="p-4 border-b border-blue-100 bg-blue-500">
            <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                <i class="ri-user-add-line"></i>
                Xodim ma'lumotlari
            </h3>
        </div>
        
        <div class="p-4">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- Ism -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-user-line text-blue-600 mr-1"></i>
                        Ism
                    </label>
                    <input type="text" name="ism" class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                </div>
                
                <!-- Familya -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-user-line text-blue-600 mr-1"></i>
                        Familya
                    </label>
                    <input type="text" name="familya" class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                </div>
                
                <!-- Telefon -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-phone-line text-blue-600 mr-1"></i>
                        Telefon
                    </label>
                    <input type="tel" name="telefon" class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="+998 90 123 45 67" required>
                </div>
                
                <!-- Username -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-user-settings-line text-blue-600 mr-1"></i>
                        Login (username)
                    </label>
                    <input type="text" name="username" class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                </div>
                
                <!-- Parol -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-lock-line text-blue-600 mr-1"></i>
                        Parol
                    </label>
                    <input type="password" name="password" class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                </div>
                
                <!-- Rasm -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-image-line text-blue-600 mr-1"></i>
                        Rasm (ixtiyoriy)
                    </label>
                    <input type="file" name="rasm" accept="image/*" class="w-full p-2 border border-gray-200 rounded-lg">
                    <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF (5MB gacha)</p>
                </div>
                
                <!-- Admin huquqi -->
                <div class="mb-6 p-4 bg-purple-50 rounded-lg border border-purple-200">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="is_admin_huquqi" value="on" class="w-5 h-5 text-purple-600 bg-white border-gray-300 rounded focus:ring-purple-500">
                        <div>
                            <span class="text-sm font-semibold text-purple-800">
                                <i class="ri-shield-user-line mr-1"></i> Admin huquqi
                            </span>
                            <p class="text-xs text-purple-600 mt-0.5">Belgilansa, bu xodim boshqa xodimlarni boshqarish huquqiga ega bo'ladi</p>
                        </div>
                    </label>
                </div>
                
                <!-- Tugmalar -->
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all font-medium flex items-center justify-center gap-2">
                        <i class="ri-check-line"></i>
                        Xodim qo'shish
                    </button>
                    <a href="{% url 'xodimlar' %}" class="px-4 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center justify-center">
                        <i class="ri-close-line text-xl"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
